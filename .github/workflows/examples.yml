name: Package examples

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-examples
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Package tracked example files
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/examples.zip" HEAD examples/
          unzip -tq "$RUNNER_TEMP/examples.zip"
      - name: Publish example download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf 'Example projects A, B, C, D, E, F and G with source photographs and opening instructions. Extract examples.zip and keep each example folder intact.\n\nAutomatically packaged from commit %s.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/examples-notes.md"
          if gh release view examples >/dev/null 2>&1; then
            gh release upload examples "$RUNNER_TEMP/examples.zip" --clobber
            gh release edit examples --notes-file "$RUNNER_TEMP/examples-notes.md" --latest=false
          else
            gh release create examples "$RUNNER_TEMP/examples.zip" \
              --target "$GITHUB_SHA" --title 'Examples' \
              --notes-file "$RUNNER_TEMP/examples-notes.md" --latest=false
          fi
